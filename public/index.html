<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ECS 服务管理</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="container">
      <header class="header">
        <h1>ECS 服务管理面板</h1>
        <div class="header-actions">
          <button id="refreshBtn">刷新状态</button>
          <button id="logoutBtn" class="secondary-btn">退出登录</button>
        </div>
      </header>

      <section id="authPanel" class="auth-panel">
        <h2>登录面板</h2>
        <p class="hint">请输入面板账号密码（与服务端 PANEL_USERNAME / PANEL_PASSWORD 一致）。</p>
        <form id="authForm" class="auth-form">
          <input id="authUsername" type="text" placeholder="用户名" autocomplete="username" required />
          <input
            id="authPassword"
            type="password"
            placeholder="密码"
            autocomplete="current-password"
            required
          />
          <button type="submit">登录</button>
        </form>
        <p id="authMessage" class="auth-message"></p>
      </section>

      <p class="hint">通过两个 Tab 完成日常运维：服务管理（Systemd + Docker）与代理配置（Nginx）。</p>

      <nav class="tabs" id="tabsNav">
        <button class="tab-btn active" data-tab="servicesTab">Systemd</button>
        <button class="tab-btn" data-tab="dockerTab">Docker</button>
        <button class="tab-btn" data-tab="proxyConfigTab">Nginx 代理</button>
      </nav>

      <section id="servicesTab" class="tab-panel active">
        <h2>Systemd 服务管理</h2>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>服务名</th>
                <th>当前状态</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="serviceTableBody"></tbody>
          </table>
        </div>
      </section>

      <section id="dockerTab" class="docker-section tab-panel">
        <h2>Docker 容器管理</h2>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>容器名</th>
                <th>镜像</th>
                <th>状态</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="dockerTableBody"></tbody>
          </table>
        </div>
      </section>

      <section id="proxyConfigTab" class="tab-panel">
        <h2>Nginx 代理配置</h2>
        <p class="hint">为容器定义对外访问 URL（域名 + 路径），保存后可一键应用到 Nginx。</p>
        <div style="margin-bottom: 10px">
          <button id="fillEcsProxyExampleBtn" class="secondary-btn" type="button">
            填充 ecs-service-manage 示例
          </button>
        </div>

        <form id="proxyMappingForm" class="auth-form">
          <input id="mapContainerName" type="text" placeholder="容器名（如 sim_api）" required />
          <input id="mapHost" type="text" placeholder="域名（如 api.example.com）" required />
          <input id="mapPath" type="text" placeholder="路径（如 / 或 /sim/）" value="/" required />
          <input id="mapTargetPort" type="number" placeholder="容器端口（如 8080）" required />
          <input id="mapListenPort" type="number" placeholder="Nginx监听端口（默认80）" value="80" />
          <button type="submit">新增规则</button>
        </form>

        <div class="table-wrap" style="margin-top: 10px">
          <table>
            <thead>
              <tr>
                <th>容器名</th>
                <th>Host</th>
                <th>路径</th>
                <th>容器端口</th>
                <th>监听端口</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="proxyMappingBody"></tbody>
          </table>
        </div>

        <div style="margin-top: 10px">
          <button id="saveProxyMappingsBtn">保存配置</button>
          <button id="applyProxyMappingsBtn">应用到 Nginx</button>
        </div>
      </section>

    </main>

    <section id="monitorPanel" class="monitor-panel">
      <div class="monitor-header">
        <strong>执行日志监视器</strong>
        <button id="monitorToggleBtn" class="secondary-btn">收起</button>
      </div>
      <pre id="logArea">等待操作...</pre>
      <div id="monitorResizeHandle" class="monitor-resize-handle" title="拖动调整大小"></div>
    </section>

    <script src="./app.js"></script>
  </body>
</html>
